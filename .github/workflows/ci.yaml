name: ci
on:
  push:
    branches: [main, master]
#    paths:
#      - "main_server/**"  # 변경 감지하여 실행할 경로 설정
  pull_request:
    branches: [main, master]
#    paths:
#      - "main_server/**"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: execute ruff
        uses: astral-sh/ruff-action@v4.1.0

      - name: Run tests
        run: uv run pytest
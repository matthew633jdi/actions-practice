name: b-workflow
on:
  push:
    branches: [main, master]
    paths:
      - "b_project/**"
  pull_request:
    branches: [main, master]
    paths:
      - "b_project/**"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: b_project
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: execute ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          src: b_project

      - name: Run tests
        run: uv run pytest
